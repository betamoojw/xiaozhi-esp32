name: MCP host tests

on:
  push:
    paths:
      - 'main/mcp_server.*'
      - 'main/cjson_utils.h'
      - 'main/boards/common/press_to_talk_mcp_tool.*'
      - 'main/knx/**'
      - 'main/idf_component.yml'
      - 'scripts/tests/*mcp*.py'
      - '.github/workflows/test-mcp.yml'
  pull_request:
    paths:
      - 'main/mcp_server.*'
      - 'main/cjson_utils.h'
      - 'main/boards/common/press_to_talk_mcp_tool.*'
      - 'main/knx/**'
      - 'main/idf_component.yml'
      - 'scripts/tests/*mcp*.py'
      - '.github/workflows/test-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libcjson-dev libmbedtls-dev
      - name: Checkout KNX codec sources
        uses: actions/checkout@v7
        with:
          repository: betamoojw/esp32_knx_ip
          # v1.0.0, matching main/idf_component.yml; only host codecs are linked.
          ref: 19059496b9c8230cf7473f6b729d2176350d1eb6
          path: .host-deps/esp32_knx_ip
          persist-credentials: false
      - name: Test MCP dispatcher and KNX compatibility
        env:
          CXX: g++
          ESP_KNX_IP_DIR: ${{ github.workspace }}/.host-deps/esp32_knx_ip/components/esp_knx_ip
        run: |
          python3 -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "scripts.tests.test_mcp_server", "scripts.tests.test_knx_mcp_server"])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          # Missing host dependencies must not silently turn this CI job green.
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PY
